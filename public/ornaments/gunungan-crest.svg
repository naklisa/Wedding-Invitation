<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" fill="none">
  <!-- Majestic Traditional Gunungan & Royal Arch Crest -->
  <g stroke="url(#gununganGold)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Peak Crown & Jewel -->
    <path d="M130 8 L130 25" stroke-width="2" />
    <circle cx="130" cy="6" r="3.5" fill="url(#gununganGold)" />
    <circle cx="130" cy="28" r="2" fill="url(#gununganGold)" />

    <!-- Outer Gunungan Silhouette -->
    <path d="M130 18 C118 42 75 70 60 125 L200 125 C185 70 142 42 130 18 Z" fill="url(#gununganGold)" fill-opacity="0.06" stroke-width="1.8" />
    <path d="M130 26 C120 48 85 74 72 120 L188 120 C175 74 140 48 130 26 Z" stroke-dasharray="2 3" opacity="0.7" />

    <!-- Central Sacred Tree / Flower of Life -->
    <path d="M130 120 L130 65" stroke-width="2" />
    <!-- Branch Left 1 -->
    <path d="M130 95 C115 88 102 92 95 105 C102 108 112 102 130 102" />
    <circle cx="95" cy="105" r="2" fill="url(#gununganGold)" />
    <!-- Branch Right 1 -->
    <path d="M130 95 C145 88 158 92 165 105 C158 108 148 102 130 102" />
    <circle cx="165" cy="105" r="2" fill="url(#gununganGold)" />

    <!-- Branch Left 2 (Higher) -->
    <path d="M130 78 C118 70 108 72 105 82 C112 85 120 80 130 82" />
    <circle cx="105" cy="82" r="2" fill="url(#gununganGold)" />
    <!-- Branch Right 2 (Higher) -->
    <path d="M130 78 C142 70 152 72 155 82 C148 85 140 80 130 82" />
    <circle cx="155" cy="82" r="2" fill="url(#gununganGold)" />

    <!-- Top Bloom -->
    <circle cx="130" cy="55" r="6" fill="url(#gununganGold)" fill-opacity="0.3" />
    <path d="M130 45 C124 50 124 60 130 65 C136 60 136 50 130 45 Z" fill="url(#gununganGold)" fill-opacity="0.5" />
    <path d="M120 55 C125 49 135 49 140 55 C135 61 125 61 120 55 Z" fill="url(#gununganGold)" fill-opacity="0.5" />

    <!-- Left Wing Flourish -->
    <path d="M60 125 C45 110 32 118 20 128 C28 132 40 126 55 128" />
    <circle cx="20" cy="128" r="2" fill="url(#gununganGold)" />

    <!-- Right Wing Flourish -->
    <path d="M200 125 C215 110 228 118 240 128 C232 132 220 126 205 128" />
    <circle cx="240" cy="128" r="2" fill="url(#gununganGold)" />

    <!-- Bottom Base Border -->
    <path d="M15 132 L245 132" stroke-width="1.5" />
    <path d="M30 136 L230 136" stroke-width="0.8" stroke-dasharray="3 3" />
  </g>

  <defs>
    <linearGradient id="gununganGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d6" />
      <stop offset="30%" stop-color="#e5bc54" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#ffd978" />
    </linearGradient>
  </defs>
</svg>
