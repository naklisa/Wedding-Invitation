<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- Seamless Traditional Royal Floral / Damask Pattern -->
  <g stroke="#f3d898" stroke-width="0.8" opacity="0.18">
    <!-- Center Mandala/Flower Motif -->
    <path d="M60 40 C52 48 52 54 60 62 C68 54 68 48 60 40 Z" fill="#f3d898" fill-opacity="0.05" />
    <path d="M40 60 C48 52 54 52 62 60 C54 68 48 68 40 60 Z" fill="#f3d898" fill-opacity="0.05" />
    <circle cx="60" cy="60" r="6" />
    <circle cx="60" cy="60" r="14" stroke-dasharray="2 3" />
    <circle cx="60" cy="60" r="22" stroke-width="0.5" />

    <!-- Four diagonal petals -->
    <path d="M46 46 C52 40 56 44 54 50 C48 52 44 48 46 46 Z" />
    <path d="M74 46 C68 40 64 44 66 50 C72 52 76 48 74 46 Z" />
    <path d="M46 74 C52 80 56 76 54 70 C48 68 44 72 46 74 Z" />
    <path d="M74 74 C68 80 64 76 66 70 C72 68 76 72 74 74 Z" />

    <!-- Corner Motifs (Seamless Wrap) -->
    <!-- Top-Left -->
    <circle cx="0" cy="0" r="14" stroke-dasharray="2 3" />
    <path d="M0 20 C8 14 14 8 20 0" />
    <circle cx="0" cy="0" r="6" />
    
    <!-- Top-Right -->
    <circle cx="120" cy="0" r="14" stroke-dasharray="2 3" />
    <path d="M120 20 C112 14 106 8 100 0" />
    <circle cx="120" cy="0" r="6" />

    <!-- Bottom-Left -->
    <circle cx="0" cy="120" r="14" stroke-dasharray="2 3" />
    <path d="M0 100 C8 106 14 112 20 120" />
    <circle cx="0" cy="120" r="6" />

    <!-- Bottom-Right -->
    <circle cx="120" cy="120" r="14" stroke-dasharray="2 3" />
    <path d="M120 100 C112 106 106 112 100 120" />
    <circle cx="120" cy="120" r="6" />

    <!-- Connecting Vines -->
    <path d="M60 22 C60 10 50 5 60 0" />
    <path d="M60 98 C60 110 70 115 60 120" />
    <path d="M22 60 C10 60 5 50 0 60" />
    <path d="M98 60 C110 60 115 70 120 60" />
  </g>
</svg>
