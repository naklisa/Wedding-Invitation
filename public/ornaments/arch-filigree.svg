<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Royal Arch Filigree Tiara Crown -->
  <g stroke="url(#goldCrown)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Peak -->
    <path d="M120 12 L120 28" stroke-width="2"/>
    <circle cx="120" cy="8" r="3.5" fill="url(#goldCrown)"/>
    
    <!-- Central Dome Arc -->
    <path d="M70 65 C90 35 150 35 170 65" />
    <path d="M60 70 C85 28 155 28 180 70" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Left Scroll -->
    <path d="M120 30 C105 20 85 25 80 40 C75 55 90 60 95 50 C98 42 90 38 85 42" />
    <circle cx="85" cy="42" r="2" fill="url(#goldCrown)"/>
    <path d="M110 35 C100 28 92 32 90 42" />
    <circle cx="95" cy="22" r="2.5" fill="url(#goldCrown)"/>

    <!-- Right Scroll (Mirrored) -->
    <path d="M120 30 C135 20 155 25 160 40 C165 55 150 60 145 50 C142 42 150 38 155 42" />
    <circle cx="155" cy="42" r="2" fill="url(#goldCrown)"/>
    <path d="M130 35 C140 28 148 32 150 42" />
    <circle cx="145" cy="22" r="2.5" fill="url(#goldCrown)"/>

    <!-- Outer Wings -->
    <path d="M60 68 C45 60 30 65 20 72" />
    <circle cx="20" cy="72" r="2" fill="url(#goldCrown)"/>
    <path d="M180 68 C195 60 210 65 220 72" />
    <circle cx="220" cy="72" r="2" fill="url(#goldCrown)"/>
  </g>

  <defs>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa7c11" />
      <stop offset="25%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#fff2c2" />
      <stop offset="75%" stop-color="#ffd56b" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
  </defs>
</svg>
